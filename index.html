<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Walrun - Walk Run Interval Tracker</title>
        <link rel="icon" type="image/jpeg" href="./assets/walkrunicon.jpg" />
        <link rel="stylesheet" href="assets/css/output.css" />
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#059669" />
        <script src="src/js/app.js"></script>
        <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    </head>
    <body class="font-sans antialiased overflow-x-hidden" :class="{ 'dark': darkMode }" x-data="app()">
        
        <!-- Install PWA Screen -->
        <template x-if="!isStandalone">
            <div class="fixed inset-0 z-[100] bg-[var(--card-bg)] flex flex-col items-center justify-center p-8 text-center animate-entrance">
                <div class="mb-10 transform transition-transform duration-500 hover:scale-110">
                    <div class="w-24 h-24 bg-slate-100 dark:bg-slate-800 rounded-[32px] overflow-hidden flex items-center justify-center border border-[var(--card-border)] shadow-sm mx-auto">
                        <img src="assets/walkrunicon.jpg" alt="Walrun Icon" class="w-full h-full object-cover">
                    </div>
                </div>
                <h2 class="text-2xl font-bold text-[var(--app-text)] mb-2">Install Walrun</h2>
                <p class="text-[var(--muted-text)] text-sm leading-relaxed mb-10 max-w-[260px]">
                    Install the app for the best interval tracking experience and offline support.
                </p>
                <div class="w-full max-w-xs space-y-4">
                    <button @click="installPWA" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg active:scale-90 transition-all shadow-md shadow-emerald-200 dark:shadow-none hover:shadow-lg">
                        Install App
                    </button>
                    <p class="text-[11px] text-[var(--muted-text)] font-medium uppercase tracking-wider pt-4">Or use browser menu to install</p>
                </div>
            </div>
        </template>

        <!-- Main App Content -->
        <template x-if="isStandalone">
            <div class="max-w-md mx-auto min-h-screen flex flex-col p-6 relative animate-entrance">
                
                <!-- Onboarding Modal -->
                <div x-show="!isOnboarded" x-cloak class="fixed inset-0 z-[150] flex items-center justify-center p-6">
                    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity duration-300" 
                         x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>
                    <div class="relative w-full max-w-sm bg-[var(--card-bg)] p-8 rounded-[32px] shadow-xl border border-[var(--card-border)] transform"
                         x-transition:enter="transition ease-out duration-300" 
                         x-transition:enter-start="opacity-0 scale-90 translate-y-10" 
                         x-transition:enter-end="opacity-100 scale-100 translate-y-0">
                        <h2 class="text-2xl font-bold text-[var(--app-text)] mb-2">Welcome to Walrun</h2>
                        <p class="text-[var(--muted-text)] text-sm mb-8">Simple interval tracking for your better health.</p>
                        <div class="space-y-6 mb-10">
                            <div class="flex gap-4 items-center group">
                                <div class="w-10 h-10 rounded-full bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 flex-shrink-0 flex items-center justify-center font-bold group-hover:scale-110 transition-transform">1</div>
                                <p class="text-sm text-[var(--app-text)]">Choose your favorite training mode.</p>
                            </div>
                            <div class="flex gap-4 items-center group">
                                <div class="w-10 h-10 rounded-full bg-sky-50 dark:bg-sky-900/30 text-sky-600 flex-shrink-0 flex items-center justify-center font-bold group-hover:scale-110 transition-transform">2</div>
                                <p class="text-sm text-[var(--app-text)]">Switch phases with audio cues.</p>
                            </div>
                        </div>
                        <button @click="finishOnboarding" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg active:scale-95 transition-all shadow-lg shadow-emerald-100 dark:shadow-none hover:bg-emerald-700">
                            Got it, Let's Run!
                        </button>
                    </div>
                </div>

                <!-- Top Toolbar -->
                <div class="flex justify-end gap-3" x-show="status === 'idle'">
                    <button @click="toggleDarkMode" class="w-10 h-10 bg-[var(--card-bg)] border border-[var(--card-border)] rounded-full flex items-center justify-center shadow-sm active:scale-75 transition-all">
                        <svg x-show="!darkMode" class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                        <svg x-show="darkMode" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707ZM12 7a5 5 0 100 10 5 5 0 000-10z"></path></svg>
                    </button>
                    <button @click="showHistory = true" class="w-10 h-10 bg-[var(--card-bg)] border border-[var(--card-border)] rounded-full flex items-center justify-center shadow-sm active:scale-75 transition-all">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </button>
                </div>

                <main class="flex-grow flex flex-col items-center justify-start space-y-8 pt-8 pb-10">
                    
                    <!-- Mode Selector -->
                    <div class="flex bg-[var(--pill-bg)] p-1 rounded-2xl w-full max-w-[280px] shrink-0" x-show="status === 'idle'">
                        <template x-for="m in ['normal', 'galloway', 'custom', 'record']">
                            <button @click="setMode(m)" :class="mode === m ? 'bg-[var(--card-bg)] text-emerald-600 shadow-sm' : 'text-[var(--muted-text)] hover:text-[var(--app-text)]'" 
                                    class="flex-1 py-2 text-xs font-bold rounded-xl transition-all capitalize active:scale-90" x-text="m"></button>
                        </template>
                    </div>

                    <!-- Previous Records -->
                    <div class="w-full min-h-[100px] flex items-center" x-show="status === 'idle' && history.some(h => h.mode === 'RECORD')">
                        <div class="w-full overflow-hidden"
                             x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 translate-x-10" x-transition:enter-end="opacity-100 translate-x-0">
                            <div class="flex gap-3 overflow-x-auto pb-2 px-2 no-scrollbar touch-pan-x">
                                <div class="flex gap-3 min-w-fit pr-4">
                                    <template x-for="h in history.filter(h => h.mode === 'RECORD')">
                                        <button @click="openRecordModal(h)" class="flex-shrink-0 bg-[var(--card-bg)] border border-[var(--card-border)] p-4 rounded-2xl text-left hover:border-emerald-300 hover:shadow-md transition-all active:scale-90 min-w-[130px] shadow-sm">
                                            <p class="text-[10px] font-bold text-[var(--muted-text)] mb-2" x-text="h.date"></p>
                                            <div class="flex justify-between items-end">
                                                <div>
                                                    <p class="text-[8px] text-[var(--muted-text)] uppercase font-black">Run</p>
                                                    <p class="text-sm font-bold text-emerald-600" x-text="(h.medianRun || h.runTime) + 's'"></p>
                                                </div>
                                                <div>
                                                    <p class="text-[8px] text-[var(--muted-text)] uppercase font-black text-right">Walk</p>
                                                    <p class="text-sm font-bold text-sky-600" x-text="(h.medianWalk || h.walkTime) + 's'"></p>
                                                </div>
                                            </div>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Timer Circle -->
                    <div :class="[
                            status === 'running' ? (phase === 'RUN' ? 'timer-border-run animate-pulse-driven' : 'timer-border-walk animate-pulse-driven') : 'border-[var(--card-border)]',
                            isPaused ? 'animate-none opacity-60' : ''
                         ]" 
                         class="w-72 h-72 rounded-full border-8 flex flex-col items-center justify-center transition-all duration-500 bg-[var(--card-bg)] relative shadow-sm transform shrink-0">
                        <div class="absolute -top-3 px-4 py-1 rounded-full bg-slate-900 dark:bg-slate-800 text-white shadow-lg transition-transform duration-300"
                             :class="status === 'running' ? 'scale-110' : 'scale-100'">
                            <span class="text-[10px] font-bold tracking-widest uppercase transition-colors" :class="phase === 'RUN' ? 'text-emerald-400' : 'text-sky-400'" x-text="status === 'idle' ? 'Ready' : phase"></span>
                        </div>
                        <span class="text-7xl font-bold tracking-tighter tabular-nums text-[var(--app-text)] transition-all duration-300"
                              :class="status === 'running' ? 'scale-105' : 'scale-100'" x-text="formatTime(timeLeft)">00:00</span>
                        <div class="mt-4 flex flex-col items-center opacity-40">
                            <p class="text-[10px] font-bold uppercase tracking-widest">Total Session</p>
                            <p class="text-lg font-bold" x-text="formatTime(totalTime)">00:00</p>
                        </div>
                    </div>

                    <!-- Settings Sections -->
                    <div class="w-full max-w-[280px] min-h-[160px] flex flex-col justify-center">
                        <div x-show="status === 'idle'">
                            <div x-show="mode === 'galloway'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="space-y-6">
                                <div class="flex justify-between items-center px-1">
                                    <span class="text-xs font-bold text-[var(--muted-text)]">Target Pace</span>
                                    <span class="text-xl font-bold text-emerald-600" x-text="gallowayPace + ':00 /km'"></span>
                                </div>
                                <input type="range" min="5" max="10" x-model="gallowayPace" @input="updateGalloway" class="w-full h-2 bg-[var(--pill-bg)] rounded-lg appearance-none cursor-pointer">
                                <div class="flex gap-2">
                                    <div class="flex-1 bg-[var(--card-bg)] p-3 rounded-2xl border border-[var(--card-border)] shadow-sm text-center">
                                        <p class="text-[8px] text-[var(--muted-text)] uppercase font-bold">Run</p>
                                        <p class="text-sm font-bold text-[var(--app-text)]" x-text="formatTime(runTime)"></p>
                                    </div>
                                    <div class="flex-1 bg-[var(--card-bg)] p-3 rounded-2xl border border-[var(--card-border)] shadow-sm text-center">
                                        <p class="text-[8px] text-[var(--muted-text)] uppercase font-bold">Walk</p>
                                        <p class="text-sm font-bold text-[var(--app-text)]" x-text="formatTime(walkTime)"></p>
                                    </div>
                                </div>
                            </div>
                            <div x-show="mode === 'custom'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="grid grid-cols-2 gap-3">
                                <div class="bg-[var(--card-bg)] p-4 rounded-2xl border border-[var(--card-border)] shadow-sm focus-within:border-emerald-400 transition-colors">
                                    <label class="text-[9px] text-[var(--muted-text)] font-bold uppercase block mb-1">Run (Sec)</label>
                                    <input type="number" x-model="runTime" @input="timeLeft = runTime" class="w-full text-center font-bold text-emerald-600 outline-none text-lg bg-transparent">
                                </div>
                                <div class="bg-[var(--card-bg)] p-4 rounded-2xl border border-[var(--card-border)] shadow-sm focus-within:border-sky-400 transition-colors">
                                    <label class="text-[9px] text-[var(--muted-text)] font-bold uppercase block mb-1">Walk (Sec)</label>
                                    <input type="number" x-model="walkTime" class="w-full text-center font-bold text-sky-600 outline-none text-lg bg-transparent">
                                </div>
                            </div>
                        </div>

                        <!-- Running Actions -->
                        <div x-show="status === 'running'" x-transition:enter="transition ease-out duration-500" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100" class="flex justify-center">
                            <button @click="togglePhase" class="w-full py-5 rounded-[32px] font-bold text-xl shadow-xl transition-all active:scale-95 text-white transform hover:scale-105" 
                                    :class="phase === 'RUN' ? 'bg-sky-500 shadow-sky-100 dark:shadow-none' : 'bg-emerald-500 shadow-emerald-100 dark:shadow-none'">
                                Switch to <span x-text="phase === 'RUN' ? 'Walk' : 'Run'"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Bottom Controls -->
                    <div class="w-full flex gap-4 pt-4">
                        <button x-show="status === 'idle'" @click="startTimer" 
                                class="flex-grow bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 py-5 rounded-[32px] font-bold text-lg active:scale-90 transition-all shadow-xl shadow-slate-200 dark:shadow-none">
                            Start Session
                        </button>
                        <div x-show="status === 'running'" class="w-full flex gap-3">
                            <button @click="pauseTimer" class="flex-grow py-5 rounded-[32px] font-bold transition-all active:scale-90" 
                                    :class="isPaused ? 'bg-emerald-600 text-white animate-pulse' : 'bg-[var(--pill-bg)] text-[var(--app-text)]'" x-text="isPaused ? 'Resume' : 'Pause'"></button>
                            <button @click="finishSession" class="px-8 bg-red-50 dark:bg-red-900/20 text-red-500 border border-red-100 dark:border-red-900/30 py-5 rounded-[32px] font-bold active:scale-75 transition-all hover:bg-red-100 hover:animate-energetic-shake">Finish</button>
                        </div>
                    </div>
                </main>

                <!-- History Bottom Sheet -->
                <div x-show="showHistory" x-cloak class="fixed inset-0 z-[200] flex items-end">
                    <div @click="showHistory = false" class="absolute inset-0 bg-slate-900/20 dark:bg-slate-950/60 backdrop-blur-sm"
                         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>
                    <div x-show="showHistory" 
                         x-transition:enter="transition cubic-bezier(0.16, 1, 0.3, 1) duration-500 transform" 
                         x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0" 
                         class="relative w-full bg-[var(--card-bg)] rounded-t-[40px] p-8 max-h-[80vh] overflow-y-auto shadow-2xl border-t border-[var(--card-border)]">
                        <div class="w-12 h-1 bg-[var(--pill-bg)] rounded-full mx-auto mb-8"></div>
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-bold text-[var(--app-text)]">Training Log</h2>
                            <button @click="clearHistory" class="text-xs font-bold text-red-500 px-3 py-1 rounded-full bg-red-50 dark:bg-red-900/20 active:scale-75 transition-transform">Clear</button>
                        </div>
                        <div class="space-y-3">
                            <template x-for="(h, index) in history">
                                <div class="bg-[var(--app-bg)] p-4 rounded-2xl border border-[var(--card-border)] flex justify-between items-center transform transition-all duration-300 hover:translate-x-2"
                                     x-transition:enter="transition ease-out duration-300" :style="'transition-delay: ' + (index * 50) + 'ms'">
                                    <div>
                                        <p class="font-bold text-sm text-[var(--app-text)] capitalize" x-text="h.mode"></p>
                                        <p class="text-[10px] text-[var(--muted-text)] font-medium" x-text="h.date"></p>
                                    </div>
                                    <p class="font-bold text-emerald-600 text-lg" x-text="h.total"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Record Modal -->
                <div x-show="showRecordModal" x-cloak class="fixed inset-0 z-[210] flex items-center justify-center p-6">
                    <div @click="showRecordModal = false" class="absolute inset-0 bg-slate-900/40 dark:bg-slate-950/60 backdrop-blur-sm"
                         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>
                    <div class="relative bg-[var(--card-bg)] p-8 rounded-[32px] w-full max-w-xs shadow-2xl text-center border border-[var(--card-border)] transform"
                         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100">
                        <h3 class="text-xl font-bold text-[var(--app-text)] mb-1">Record Action</h3>
                        <p class="text-[10px] text-[var(--muted-text)] font-bold mb-8 uppercase tracking-widest" x-text="selectedRecord?.date"></p>
                        <div class="space-y-3">
                            <button @click="useRecord" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-md active:scale-90 transition-all">Use Record</button>
                            <button @click="deleteRecord" class="w-full bg-red-50 dark:bg-red-900/20 text-red-500 py-4 rounded-2xl font-bold active:scale-90 transition-all">Delete</button>
                            <button @click="showRecordModal = false" class="w-full py-2 text-[var(--muted-text)] font-bold text-xs uppercase tracking-widest active:opacity-50">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Session Summary Modal -->
                <div x-show="showStatsModal" x-cloak class="fixed inset-0 z-[220] flex items-center justify-center p-6">
                    <div @click="showStatsModal = false" class="absolute inset-0 bg-slate-900/40 dark:bg-slate-950/60 backdrop-blur-md"
                         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>
                    <div x-show="showStatsModal" 
                         x-transition:enter="transition cubic-bezier(0.16, 1, 0.3, 1) duration-500 transform" 
                         x-transition:enter-start="opacity-0 scale-50 translate-y-20" x-transition:enter-end="opacity-100 scale-100 translate-y-0" 
                         class="relative bg-[var(--card-bg)] p-8 rounded-[40px] w-full max-w-sm shadow-2xl text-center border border-[var(--card-border)]">
                        <div class="w-16 h-16 bg-emerald-50 dark:bg-emerald-900/20 rounded-full flex items-center justify-center mx-auto mb-6 transform transition-transform duration-700 delay-300"
                             :class="showStatsModal ? 'scale-110 rotate-[360deg]' : 'scale-0'">
                            <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h2 class="text-2xl font-bold text-[var(--app-text)] mb-1">Session Done!</h2>
                        <p class="text-[10px] text-[var(--muted-text)] font-bold uppercase mb-8" x-text="lastSession?.date"></p>
                        <div class="grid grid-cols-2 gap-3 mb-8">
                            <div class="bg-[var(--app-bg)] p-4 rounded-2xl border border-[var(--card-border)] transform transition-all duration-500 delay-400"
                                 :class="showStatsModal ? 'translate-y-0 opacity-100' : 'translate-y-4 opacity-0'">
                                <p class="text-[8px] text-[var(--muted-text)] uppercase font-black mb-1">Total Time</p>
                                <p class="text-xl font-bold text-[var(--app-text)]" x-text="lastSession?.total"></p>
                            </div>
                            <div class="bg-[var(--app-bg)] p-4 rounded-2xl border border-[var(--card-border)] transform transition-all duration-500 delay-500"
                                 :class="showStatsModal ? 'translate-y-0 opacity-100' : 'translate-y-4 opacity-0'">
                                <p class="text-[8px] text-[var(--muted-text)] uppercase font-black mb-1">Mode</p>
                                <p class="text-xl font-bold text-emerald-600" x-text="lastSession?.mode"></p>
                            </div>
                        </div>
                        <button @click="showStatsModal = false" class="w-full bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 py-4 rounded-2xl font-bold active:scale-95 transition-all">
                            Close Summary
                        </button>
                    </div>
                </div>

                <!-- Toast Notification -->
                <div x-show="showToast" 
                     x-transition:enter="transition cubic-bezier(0.16, 1, 0.3, 1) duration-500 transform"
                     x-transition:enter-start="-translate-y-20 opacity-0"
                     x-transition:enter-end="translate-y-0 opacity-100"
                     x-transition:leave="transition ease-in duration-200 transform"
                     x-transition:leave-end="-translate-y-20 opacity-0"
                     class="fixed top-6 left-1/2 -translate-x-1/2 z-[300] flex items-center gap-3 bg-slate-900 dark:bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl"
                     x-cloak>
                    <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></div>
                    <p class="text-xs font-bold" x-text="toastMessage"></p>
                </div>
            </div>
        </template>

        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register("./sw.js");
                });
            }
        </script>
    </body>
</html>
